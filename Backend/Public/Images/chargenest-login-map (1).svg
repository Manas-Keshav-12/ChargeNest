<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 560 420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Charger map and booking on a phone</title>
  <desc id="d">A map with charger pins and a route, and a phone showing a confirmed booking with a battery ring at 78 percent.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
    <clipPath id="mapclip"><rect x="40" y="60" width="330" height="270" rx="24"/></clipPath>
    <polygon id="bolt" points="6,0 0,10 5,10 3,18 12,7 7,7"/>
    <g id="pin">
      <path d="M0 -22 C-12 -22 -18 -13 -18 -6 C-18 8 0 24 0 24 C0 24 18 8 18 -6 C18 -13 12 -22 0 -22 Z" fill="currentColor"/>
      <circle cy="-7" r="9" fill="#FFFFFF"/>
      <polygon points="6,0 0,10 5,10 3,18 12,7 7,7" fill="currentColor" transform="translate(-4.5 -13.75) scale(.75)"/>
    </g>
  </defs>

  <style>
    .float-a { animation: float 5s ease-in-out infinite; }
    .float-b { animation: float 6.5s ease-in-out -2.5s infinite; }
    .route   { stroke-dasharray: 1 11; animation: route 1.4s linear infinite; }
    .ring    { animation: ring 6s ease-in-out infinite; }
    .ripple  { transform-box: fill-box; transform-origin: center; animation: ripple 2.6s ease-out infinite; }
    @keyframes float  { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes route  { to { stroke-dashoffset: -24; } }
    @keyframes ring   { 0% { stroke-dasharray: 80 264; } 65%, 100% { stroke-dasharray: 206 264; } }
    @keyframes ripple { 0% { transform: scale(.5); opacity: .5; } 100% { transform: scale(1.8); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    text { font-family: Poppins, 'Segoe UI', Arial, sans-serif; }
  </style>

  <!-- background -->
  <circle cx="290" cy="215" r="195" fill="#E9FBF2"/>
  <circle cx="500" cy="60" r="44" fill="#D6F5E6"/>

  <!-- map card -->
  <rect x="40" y="60" width="330" height="270" rx="24" fill="#EAF8F0" filter="url(#shadow)"/>
  <g clip-path="url(#mapclip)">
    <rect x="40" y="60" width="330" height="270" fill="#EAF8F0"/>
    <rect x="190" y="215" width="80" height="52" rx="12" fill="#BFEBD3"/>
    <rect x="60" y="76" width="70" height="40" rx="12" fill="#BFEBD3"/>
    <rect x="310" y="270" width="60" height="40" rx="12" fill="#BFEBD3"/>
    <path d="M30 322 Q150 285 250 324 T380 300" fill="none" stroke="#CFE6FF" stroke-width="18" stroke-linecap="round"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round">
      <path d="M30 192 H380"/>
      <path d="M30 98 H380"/>
      <path d="M170 50 V340"/>
      <path d="M300 50 V340"/>
    </g>
  </g>

  <!-- route -->
  <path class="route" d="M80 262 C115 222 150 238 170 192 S 262 150 285 124" fill="none" stroke="#00A86B" stroke-width="5" stroke-linecap="round"/>

  <!-- home marker -->
  <circle cx="80" cy="262" r="11" fill="#0F172A" opacity=".15"/>
  <circle cx="80" cy="262" r="7" fill="#0F172A"/>
  <circle cx="80" cy="262" r="3" fill="#FFFFFF"/>

  <!-- pins -->
  <use href="#pin" xlink:href="#pin" x="110" y="150" color="#00A86B"/>
  <use href="#pin" xlink:href="#pin" x="232" y="226" color="#F59E0B"/>
  <ellipse class="ripple" cx="285" cy="124" rx="14" ry="5" fill="#00A86B"/>
  <use href="#pin" xlink:href="#pin" x="285" y="100" color="#00A86B" transform="translate(0 0)"/>

  <!-- phone -->
  <g class="float-b">
    <rect x="330" y="90" width="170" height="300" rx="28" fill="#0F172A" filter="url(#shadow)"/>
    <rect x="340" y="100" width="150" height="280" rx="20" fill="#FFFFFF"/>
    <rect x="394" y="108" width="42" height="8" rx="4" fill="#0F172A"/>

    <circle cx="364" cy="146" r="11" fill="#DCFCE7"/>
    <path d="M358.5 146 L362.5 150 L370 141.5" fill="none" stroke="#15803D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="380" y="150" font-size="10" font-weight="600" fill="#0F172A">Booking confirmed</text>

    <circle cx="415" cy="222" r="42" fill="none" stroke="#E2E8F0" stroke-width="10"/>
    <circle class="ring" cx="415" cy="222" r="42" fill="none" stroke="#00A86B" stroke-width="10" stroke-linecap="round" stroke-dasharray="206 264" transform="rotate(-90 415 222)"/>
    <text x="415" y="226" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">78%</text>
    <text x="415" y="241" text-anchor="middle" font-size="10" fill="#64748B">charged</text>

    <text x="356" y="298" font-size="10" fill="#64748B">Charger</text>
    <text x="474" y="298" text-anchor="end" font-size="12" font-weight="600" fill="#0F172A">Slot A2</text>
    <line x1="356" y1="308" x2="474" y2="308" stroke="#EEF2F6" stroke-width="2"/>
    <text x="356" y="326" font-size="10" fill="#64748B">Arrival</text>
    <text x="474" y="326" text-anchor="end" font-size="12" font-weight="600" fill="#0F172A">7:30 PM</text>

    <rect x="356" y="340" width="118" height="28" rx="14" fill="#00A86B"/>
    <text x="415" y="358" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">View booking</text>
  </g>

  <!-- chip -->
  <g class="float-a">
    <rect x="22" y="22" width="180" height="46" rx="14" fill="#FFFFFF" filter="url(#shadow)"/>
    <circle cx="46" cy="45" r="13" fill="#E9FBF2"/>
    <use href="#bolt" xlink:href="#bolt" transform="translate(40.5 36.5) scale(.9)" fill="#00A86B"/>
    <text x="68" y="42" font-size="12" font-weight="600" fill="#0F172A">2 chargers empty</text>
    <text x="68" y="57" font-size="10" fill="#64748B">Updated just now</text>
  </g>
</svg>
