<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">EV charging at an apartment building</title>
  <desc id="d">An electric car plugged into a charging station next to an apartment block, with cards showing an available slot and charging progress.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <pattern id="windows" width="50" height="50" patternUnits="userSpaceOnUse" patternTransform="translate(70 140)">
      <rect x="12" y="10" width="26" height="30" rx="4" fill="#D6F5E6"/>
    </pattern>
  </defs>

  <style>
    .float-a { animation: float 5s ease-in-out infinite; }
    .float-b { animation: float 6s ease-in-out -2s infinite; }
    .bolt    { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
    .flow    { stroke-dasharray: 6 10; animation: flow 1.2s linear infinite; }
    .bar     { transform-box: fill-box; transform-origin: left center; animation: fill 7s ease-in-out infinite; }
    .led     { animation: blink 2s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.18); opacity: .8; } }
    @keyframes flow  { to { stroke-dashoffset: -32; } }
    @keyframes fill  { 0% { transform: scaleX(.3); } 65%, 100% { transform: scaleX(1); } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <!-- background shapes -->
  <circle cx="330" cy="250" r="225" fill="#E9FBF2"/>
  <circle cx="500" cy="130" r="70" fill="#D6F5E6"/>

  <!-- apartment building -->
  <rect x="60" y="128" width="170" height="14" rx="5" fill="#BFE9D5"/>
  <rect x="70" y="140" width="150" height="290" fill="#FFFFFF" stroke="#CFEFE0" stroke-width="2"/>
  <rect x="70" y="140" width="150" height="250" fill="url(#windows)"/>
  <rect x="82" y="200" width="26" height="30" rx="4" fill="#FDE68A"/>
  <rect x="132" y="300" width="26" height="30" rx="4" fill="#FDE68A"/>
  <rect x="182" y="250" width="26" height="30" rx="4" fill="#FDE68A"/>
  <rect x="120" y="392" width="50" height="38" rx="5" fill="#00A86B"/>

  <!-- ground -->
  <rect x="30" y="430" width="580" height="14" rx="7" fill="#D3EDE0"/>

  <!-- tree -->
  <rect x="259" y="412" width="6" height="18" fill="#A16207"/>
  <circle cx="262" cy="402" r="20" fill="#4ADE80"/>
  <circle cx="250" cy="411" r="13" fill="#86EFAC"/>

  <!-- charging station -->
  <rect x="290" y="422" width="90" height="10" rx="5" fill="#1E293B"/>
  <rect x="300" y="270" width="70" height="158" rx="14" fill="#0F172A"/>
  <rect x="312" y="286" width="46" height="54" rx="8" fill="#00A86B"/>
  <polygon class="bolt" points="338,292 326,316 334,316 330,334 346,308 337,308" fill="#FDE68A"/>
  <circle class="led" cx="335" cy="356" r="5" fill="#4ADE80"/>
  <rect x="322" y="372" width="26" height="40" rx="6" fill="#1E293B"/>

  <!-- cable -->
  <path d="M370 392 C392 424 404 402 418 384" fill="none" stroke="#0F172A" stroke-width="5" stroke-linecap="round"/>
  <path class="flow" d="M370 392 C392 424 404 402 418 384" fill="none" stroke="#4ADE80" stroke-width="2.5" stroke-linecap="round"/>

  <!-- car -->
  <g transform="translate(400 330)">
    <path d="M0 80 L0 56 Q0 44 12 40 L48 32 Q66 4 100 2 L140 2 Q170 6 184 34 L198 40 Q210 46 210 60 L210 80 Z" fill="#00A86B"/>
    <path d="M0 68 L210 68 L210 80 L0 80 Z" fill="#00875A"/>
    <path d="M60 32 Q74 12 98 10 L114 10 L114 32 Z" fill="#D1FAE5"/>
    <path d="M122 10 L140 10 Q160 14 172 32 L122 32 Z" fill="#D1FAE5"/>
    <path d="M118 34 L118 66" stroke="#00875A" stroke-width="2"/>
    <rect x="198" y="46" width="10" height="8" rx="3" fill="#FDE68A"/>
    <rect x="2" y="46" width="8" height="8" rx="3" fill="#F87171"/>
    <circle cx="22" cy="53" r="5" fill="#0F172A"/>
    <circle cx="48" cy="82" r="18" fill="#0F172A"/>
    <circle cx="48" cy="82" r="8" fill="#94A3B8"/>
    <circle cx="166" cy="82" r="18" fill="#0F172A"/>
    <circle cx="166" cy="82" r="8" fill="#94A3B8"/>
  </g>
  <circle cx="422" cy="383" r="6" fill="#1E293B"/>

  <!-- card: slot availability -->
  <g class="float-a">
    <rect x="410" y="86" width="190" height="58" rx="14" fill="#FFFFFF" filter="url(#shadow)"/>
    <circle cx="434" cy="115" r="7" fill="#00A86B"/>
    <text x="452" y="112" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#0F172A">Slot A2</text>
    <text x="452" y="130" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#64748B">Available now</text>
  </g>

  <!-- card: charging progress -->
  <g class="float-b">
    <rect x="290" y="186" width="190" height="62" rx="14" fill="#FFFFFF" filter="url(#shadow)"/>
    <text x="308" y="210" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Charging</text>
    <text x="462" y="210" text-anchor="end" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#00A86B">78%</text>
    <rect x="308" y="222" width="154" height="8" rx="4" fill="#E2E8F0"/>
    <rect class="bar" x="308" y="222" width="120" height="8" rx="4" fill="#00A86B"/>
  </g>
</svg>
